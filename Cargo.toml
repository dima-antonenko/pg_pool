[package]
name = "pg_pool"
version = "0.1.0"
edition = "2024"
description = "Асинхронный пул соединений PostgreSQL"
readme = "README.md"
keywords = ["postgres", "pool", "database", "async"]
categories = ["database", "asynchronous"]

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
